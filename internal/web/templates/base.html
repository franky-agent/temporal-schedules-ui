{{define "base.html"}}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Temporal Schedules</title>
  <link rel="stylesheet" href="/static/style.css">
  <script src="https://unpkg.com/htmx.org@2.0.6" defer></script>
</head>
<body>
  <header class="topbar">
    <div class="topbar-inner">
      <a href="/" class="brand">
        <span class="brand-mark">⏱</span>
        Temporal Schedules
      </a>
      <nav>
        <a href="/" class="nav-link">Schedules</a>
        <button class="btn btn-primary btn-sm"
                hx-get="/schedules/new"
                hx-target="#create-panel"
                hx-swap="innerHTML">
          + New Schedule
        </button>
      </nav>
    </div>
  </header>

  <main class="container">
    {{block "content" .}}{{end}}
  </main>

  <footer class="footer">
    <span>Temporal Schedules UI · htmx + Go {{goVersion}}</span>
  </footer>
</body>
</html>
{{end}}
